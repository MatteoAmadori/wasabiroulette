<!DOCTYPE html>
<html lang="it">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wasabi Roulette</title>

<!-- Google Font giapponese -->
<link href="https://fonts.googleapis.com/css2?family=Kosugi+Maru&display=swap" rel="stylesheet">

<style>
  /* Font Berthold Block locale */
  @font-face {
    font-family: 'Berthold Block';
    src: url('fonts/BertholdBlock.otf') format('opentype');
    font-weight: normal;
    font-style: normal;
  }

  html, body {
    height: 100%;
    margin: 0;
  }
  
  body {
    font-family: 'Berthold Block', 'Kosugi Maru', sans-serif;
    text-align: center;
  
    background-color: #fff8f0;
    background-size: cover;
    background-repeat: no-repeat;
    background-position: center;
    -webkit-tap-highlight-color: transparent;
    min-height: 100dvh;
  }

  body::before {
    content: "";
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(255, 248, 240, 0.6);
    z-index: -1;
  }

  h1 {
    margin-top: 20px;
    font-size: 2.5em;
  }

  button {
    margin-top: 10px;
    padding: 10px 20px;
    font-size: 16px;
    border: none;
    border-radius: 8px;
    background: linear-gradient(90deg, #ff922b, #ff7f08);
    color: white;
    cursor: pointer;
    font-family: 'Berthold Block', 'Kosugi Maru', sans-serif;
    touch-action: manipulation
  }

  button:hover {
    background: #ff922b;
    transform: translateY(1px);
  }

  
  button:active {
    transform: scale(0.97);
    box-shadow: 0 3px 8px rgba(0,0,0,0.2);
  }

  .grid {
    display: grid;
    gap: 10px;
    justify-content: center;
    margin: 20px auto;
    width: 95vw;
    max-width: 500px;
  }

  .card {
    width: 100%;
    aspect-ratio: 1 / 1;
    min-width: 60px;
    perspective: 1000px;
    cursor: pointer;
    transition: all 0.3s ease;
  }

  .card-inner {
    width: 100%;
    height: 100%;
    position: relative;
    transform-style: preserve-3d;
    transition: transform 0.6s;
  }

  .card.flipped .card-inner {
    transform: rotateY(180deg);
  }

  
  .card:hover{
    transform: translateY(-3px);
  }

  .card-face {
    position: absolute;
    width: 100%;
    height: 100%;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 30px;
    backface-visibility: hidden;
    font-family: 'Berthold Block', 'Kosugi Maru', sans-serif;
    overflow: hidden;
  }
  .confetti {
    position: fixed;
    top: -10px;
    width: 8px;
    height: 14px;
    opacity: 0.9;
    z-index: 9999;
    animation: fall linear forwards;
    border-radius: 2px;
  }

  @keyframes fall {
    to {
      transform: translateY(100vh) rotate(360deg);
    }
  }

  .front {
    background: linear-gradient(145deg, #ffa94d, #ff922b);
  }

  .back {
    background-color: #ff922b; /* colore arancione */
    transform: rotateY(180deg);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .back img {
    width: 70%; /* leggermente più piccolo della card */
    height: 70%;
    object-fit: contain;
    border-radius: 0; /* evita angoli bianchi */
  }

  .credits {
    margin: 20px auto;
    text-align: center;
    font-family: 'Berthold Block', 'Kosugi Maru', sans-serif;
    letter-spacing: 1px;
    color: #222;
    background: rgba(255, 255, 255, 0.6);
    display: block;
    width: fit-content;
    padding: 8px 16px;
    border-radius: 10px;
    position: fixed;
    bottom: 10px;
    left: 50%;
    transform: translateX(-50%);
  }
  @media (max-width: 600px) {
    h1 {
      font-size: 1.8em;
    }
  
    .grid {
      gap: 8px;
    }
  
    .card-face {
      font-size: 24px;
    }
  
    .back img {
      width: 60%;
      height: 60%;
    }
  }
</style>
</head>

<body>

<h1>🍣 WASABI ROULETTE 🍣</h1>
<p>Gira 5 sushi evitando il wasabi!</p>

<button onclick="startGame()">🔁 Ricomincia 🔁</button>

<div class="grid" id="grid"></div>

<div class="credits">
  Amadori, Coluccia, Sparacio, Fazzalari
</div>

<script>
const totalCards = 20;
const wasabiCount = 4;
const maxClicks = 5;

let cards, clicks, gameOver;
let cardElements = [];
const grid = document.getElementById("grid");

const sfondi = ['sfondi/1.jpg','sfondi/2.jpg','sfondi/3.jpg'];

function scegliSfondo() {
  const scelta = sfondi[Math.floor(Math.random() * sfondi.length)];
  document.body.style.backgroundImage = `url('${scelta}')`;
  document.body.style.backgroundSize = 'cover';
  document.body.style.backgroundRepeat = 'no-repeat';
  document.body.style.backgroundPosition = 'center';
}

function startGame() {
  scegliSfondo();
  aggiornaGriglia();
  grid.innerHTML = "";
  cards = [];
  clicks = 0;
  gameOver = false;
  cardElements = [];

  for (let i = 0; i < totalCards; i++) cards.push("sushi");

  for (let i = 0; i < wasabiCount; i++) {
    let index;
    do {
      index = Math.floor(Math.random() * totalCards);
    } while (cards[index] === "wasabi");
    cards[index] = "wasabi";
  }

  cards.forEach((type) => {
    const card = document.createElement("div");
    card.classList.add("card");

    const inner = document.createElement("div");
    inner.classList.add("card-inner");

    const front = document.createElement("div");
    front.classList.add("card-face", "front");
    front.innerText = "🍣";

    const back = document.createElement("div");
    back.classList.add("card-face", "back");

    // Inserimento immagine PNG sopra sfondo arancione
    const img = document.createElement('img');
    img.src = (type === "wasabi") ? 'images/wasabi.png' : 'images/salmon_nigiri.png';
    back.appendChild(img);

    inner.appendChild(front);
    inner.appendChild(back);
    card.appendChild(inner);

    card.addEventListener("click", () => {
      if (gameOver || card.classList.contains("flipped")) return;

      card.classList.add("flipped");
      clicks++;

      if (type === "wasabi") loseGame();

      if (clicks === maxClicks && !gameOver) winGame();
    });

    grid.appendChild(card);
    cardElements.push({ card, back, type });
  });
}

function loseGame() {
  gameOver = true;

  cardElements.forEach(({ card }) => {
    card.classList.add("flipped");
  });

  // Ritardo di 2 secondi prima del messaggio di sconfitta
  setTimeout(() => alert("Hai perso 😢 Ritenta e sarai più fortunato!"), 2000);
}

function winGame() {
  createConfetti();
  gameOver = true;
  setTimeout(() => alert("Hai vinto! 🎉"), 1000);
}

function createConfetti() {
  for (let i = 0; i < 100; i++) {
    const conf = document.createElement("div");
    conf.classList.add("confetti");
    conf.style.left = Math.random() * 100 + "vw";
    conf.style.backgroundColor = randomColor();
    conf.style.animationDuration = (Math.random() * 2 + 2) + "s";
    conf.style.transform = `rotate(${Math.random() * 360}deg)`;
    document.body.appendChild(conf);
    setTimeout(() => conf.remove(), 4000);
  }
}

function randomColor() {
  const colors = ["#ff0", "#f0f", "#0ff", "#ff5722", "#4caf50"];
  return colors[Math.floor(Math.random() * colors.length)];
}
function aggiornaGriglia() {
  const colonne = Math.ceil(Math.sqrt(totalCards));
  grid.style.gridTemplateColumns = `repeat(${colonne}, 1fr)`;
}
startGame();
</script>

</body>
</html>
