<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Menu Sushi</title>
<link href="https://fonts.googleapis.com/css2?family=Kosugi+Maru&display=swap" rel="stylesheet">
<style>
  /* Layout e font */
  body {
    margin: 0;
    padding: 0;
    font-family: 'Kosugi Maru', sans-serif;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;

    /* Sfondo menu sushi */
    background-image: url('images/sushi-menu-background.jpg');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    position: relative;
  }

  /* Overlay bianco semitrasparente per leggibilità */
  /*body::before {
    content: "";
    position: absolute;
    inset: 0;
    background: rgba(255, 255, 255, 0.6);
    z-index: 0;
  }*/

  /* Contenuto sopra overlay */
  .content {
    position: relative;
    z-index: 1;
    text-align: center;
  }

  h1 {
    font-size: 1.8em;
    margin: 10px 0;
    font-weight: normal;
    display: flex;
    justify-content: space-between;
    border-bottom: 1px dotted #ccc;
    padding-bottom: 5px;
  }

  /* Pulsante stile arcade / mobile */
  .play-button {
    padding: 18px 40px;
    font-size: 20px;
    font-weight: bold;
    border: none;
    border-radius: 16px;
    background: linear-gradient(135deg, #ff922b, #ff6a00);
    color: white;
    cursor: pointer;
    box-shadow: 0 6px 15px rgba(0,0,0,0.2);
    transition: all 0.2s ease;
  }

  .play-button:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 18px rgba(0,0,0,0.25);
  }

  .play-button:active {
    transform: scale(0.97);
    box-shadow: 0 3px 8px rgba(0,0,0,0.2);
  }

  .menu-title {
    text-align: center;
    font-size: 2.5em;
    color: #ff6a00;
    margin-bottom: 20px;
  }
</style>
</head>
<body>
  <div class="content">
    <div class="menu-title">🍣 Menu Sushi 🍣</div>
    <h1><span class="dish">Nigiri Salmone</span><span class="price">0.50€</span></h1>
    <h1><span class="dish">Nigiri Tonno</span><span class="price">0.60€</span></h1>
    <h1><span class="dish">Nigiri Gambero</span><span class="price">0.55€</span></h1>
    <h1><span class="dish">Maki Salmone</span><span class="price">1.50€</span></h1>
    <h1><span class="dish">Maki Tonno</span><span class="price">1.60€</span></h1>
    <h1><span class="dish">California Roll</span><span class="price">2.00€</span></h1>
    <h1><span class="dish">Uramaki Avocado</span><span class="price">1.80€</span></h1>
    <h1><span class="dish">Sashimi Salmone</span><span class="price">2.50€</span></h1>
    <h1><span class="dish">Sashimi Tonno</span><span class="price">2.60€</span></h1>
    <h1><span class="dish">Ebi Tempura</span><span class="price">1.90€</span></h1>
    <button class="play-button" onclick="location.href='gioco.html'">🎮 Gioca al Wasabi Roulette</button>
  </div>

</body>
</html>
